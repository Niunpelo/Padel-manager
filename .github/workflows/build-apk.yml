name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          if [ ! -f package.json ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n1)
            if [ -z "$ZIP" ]; then echo "No encuentro el zip en el repositorio"; exit 1; fi
            unzip -q "$ZIP" -d _proyecto
            SRC=$(dirname "$(find _proyecto -maxdepth 2 -name package.json | head -n1)")
            cp -r "$SRC"/. .
            rm -rf _proyecto
          fi

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Probar el motor del juego
        run: node test/engine.test.js

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Personalizar icono, colores y pantalla de carga
        run: node scripts/patch-android.js

      - name: Copiar el juego al proyecto Android
        run: npx cap sync android

      - name: Usar siempre la misma firma
        run: |
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk padel-manager.apk

      - name: Guardar el APK como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: padel-manager-apk
          path: padel-manager.apk
          if-no-files-found: error

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Padel Manager, compilación ${{ github.run_number }}
          files: padel-manager.apk
